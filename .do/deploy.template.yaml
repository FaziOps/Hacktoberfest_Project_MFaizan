# DigitalOcean App Platform spec, used by the "Deploy to DigitalOcean" button in the README.
# The server runs Gemma 4 through the Gemini API only: the offline Ollama model is too large to host.
spec:
  name: fabric-inspector
  services:
    - name: web
      git:
        repo_clone_url: https://github.com/FaziOps/Hacktoberfest_Project_MFaizan.git
        branch: main
      environment_slug: python
      run_command: uvicorn app.main:app --host 0.0.0.0 --port 8080
      http_port: 8080
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      health_check:
        http_path: /healthz
      envs:
        - key: BACKEND
          value: gemini
        - key: GEMINI_MODEL
          value: gemma-4-26b-a4b-it
        - key: GEMINI_API_KEY
          value: paste-your-gemini-api-key-here
          type: SECRET
